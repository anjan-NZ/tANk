name: Release installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The manifest inside the installer must point at the published site, not localhost.
      - name: Build the pane and the production manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build:dist -- "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Both defines have defaults in tank.iss, so leaving them out fails quietly: the finish
      # page link goes to github.com/blob/main/INSTALL.md and every build calls itself 1.0.0.
      - name: Compile the installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ("${{ github.ref_type }}" -ne "tag") {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          Write-Host "Building installer $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSupportUrl=https://github.com/${{ github.repository }}" `
            installer\tank.iss

      # Signing only runs when a certificate is configured, so forks and early
      # releases still build. Unsigned means Windows shows a SmartScreen warning.
      - name: Sign the installer
        if: env.CERT_PFX != ''
        env:
          CERT_PFX: ${{ secrets.CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
            /f cert.pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            release\tANk-Setup.exe
          Remove-Item cert.pfx

      # GitHub signs the binary's provenance, so anyone can verify it came from this
      # repo and this workflow: gh attestation verify tANk-Setup.exe --repo <owner>/<repo>
      - name: Attest the installer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/tANk-Setup.exe

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install.cmd
            dist/uninstall.cmd
            release/tANk-Setup.exe
            dist/manifest.xml
          body: |
            Close Excel, Word and PowerPoint, download **install.cmd** and double click it. No administrator rights needed.

            `tANk-Setup.exe` is the same thing as a wizard, but Windows blocks unsigned installers on some machines. SmartScreen ("Windows protected your PC") can be clicked past with **More info** then **Run anyway**. Smart App Control ("blocked an app that may be unsafe", or "Error 4551") cannot: it refuses any publisher it cannot verify and offers no override. `install.cmd` avoids both, because nothing is installed as a program.

            To check the exe came from this repository: `gh attestation verify tANk-Setup.exe --repo ${{ github.repository }}`

            Open Excel and click **tANk** on the Home tab. First time, open Settings in the pane and paste a free API key.

            Setup and troubleshooting: [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md)
